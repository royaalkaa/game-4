[project]
name = "photo-battle"
version = "0.1.0"
description = "Фото-батлы для мероприятий: бэкенд"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.5",
    "pillow==13.0.0",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "segno==1.6.6",
    "sqlalchemy==2.0.57",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_battle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "T20", "RUF"]
# Русский текст в сообщениях содержит кириллицу, похожую на латиницу.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]
